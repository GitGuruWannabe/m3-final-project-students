<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Temperature Converter Pro</h1>
        <p>Convert units and track your history instantly.</p>
    </header>

    <main class="container">
        <!-- Card 1: Converter Form -->
        <section class="card">
            <h2>Convert Unit</h2>
            <form id="tempForm">
                <div class="input-group">
                    <label for="temperature">Temperature Value:</label>
                    <input type="number" id="temperature" placeholder="e.g. 100" step="any" required>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="unitFrom">From:</label>
                        <select id="unitFrom">
                            <option value="C">Celsius (°C)</option>
                            <option value="F">Fahrenheit (°F)</option>
                            <option value="K">Kelvin (K)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="unitTo">To:</label>
                        <select id="unitTo">
                            <option value="F">Fahrenheit (°F)</option>
                            <option value="C">Celsius (°C)</option>
                            <option value="K">Kelvin (K)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="convertBtn">Convert Now</button>
            </form>

            <div id="resultBox" class="result-box">
                <p id="resultText">Result will appear here...</p>
            </div>
        </section>

        <!-- Card 2: History Log -->
        <section class="card">
            <div class="history-header">
                <h2>Conversion History</h2>
                <button id="clearBtn" class="secondary-btn">Clear</button>
            </div>
            <ul id="historyList" class="history-list">
                <li class="empty-msg">No history recorded yet.</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>M.3 Web Development Final Project | Sci30113</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
