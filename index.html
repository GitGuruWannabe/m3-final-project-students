<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>📝 To-Do List</h1>
  </header>

  <!-- INTRO -->
  <p class="intro">
    This To-Do List App helps you organize your daily tasks easily.
    You can add, complete, and delete tasks, and also switch dark mode.
  </p>

  <main class="container">

    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="Enter task" required>
      <button type="submit">Add</button>
      <button type="button" id="modeBtn">🌙</button>
    </form>

    <p>
      Visit 
      <a href="https://www.google.com" target="_blank">Google</a>
    </p>

    <img 
      src="https://cdn-icons-png.flaticon.com/512/1828/1828817.png" 
      width="50" 
      alt="To-do icon">

    <ul id="taskList"></ul>

  </main>

  <footer>
    <p>© 2026 To-Do App</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
