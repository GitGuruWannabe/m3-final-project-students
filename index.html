<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cool To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>✨ My Tasks</h1>

    <div class="top-bar">
      <input type="text" id="taskInput" placeholder="Add a task...">
      <button id="addBtn">+</button>
      <button id="modeBtn">🌙</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
